<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Letter For You</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Quicksand:wght@400;600&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe0ec;--bg2:#ffb3cf;--ink:#4a1730;--deep:#b0244f;--card:#fffdf3;--glass:rgba(255,255,255,.55);--shadow:rgba(214,51,108,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3a1226;--bg2:#2a0c1c;--ink:#ffe3ee;--deep:#ff8fb3;--card:#4a2a3a;--glass:rgba(255,255,255,.08);--shadow:rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg1:#3a1226;--bg2:#2a0c1c;--ink:#ffe3ee;--deep:#ff8fb3;--card:#4a2a3a;--glass:rgba(255,255,255,.08);--shadow:rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--ink);font:400 14px/1.7 Quicksand,'Hind Siliguri',system-ui,sans-serif;overflow-x:hidden}
.wrap{max-width:430px;margin:0 auto;padding:16px 18px 70px;text-align:center}
.back{display:inline-block;color:var(--deep);font-weight:600;text-decoration:none;margin:6px 0}
h1{font:italic 700 30px/1.2 'Cormorant Garamond','Hind Siliguri',serif;color:#d6336c;margin:8px 0 14px;text-shadow:0 2px 8px var(--shadow)}
.car{position:relative;touch-action:pan-y}
.polaroid{position:relative;width:min(270px,76%);margin:18px auto 8px;background:#fff;padding:10px 10px 12px;border-radius:10px;box-shadow:0 10px 26px var(--shadow);transform:rotate(-2deg)}
.polaroid.alt{transform:rotate(2deg)}.polaroid.flip{animation:pf .55s ease}
@keyframes pf{from{opacity:0;transform:translateY(18px) scale(.92) rotate(-6deg)}}
.polaroid:before{content:"";position:absolute;top:-10px;left:50%;width:72px;height:20px;margin-left:-36px;background:rgba(255,170,198,.8);transform:rotate(-3deg);border-radius:3px}
.pslot{aspect-ratio:4/5;border-radius:6px;background:#ffd0df;overflow:hidden;display:grid;place-items:center;font-size:64px}.pslot img{width:100%;height:100%;object-fit:cover;display:block}
.pcap{margin:8px 4px 0;font:700 14px/1.35 Quicksand,'Hind Siliguri',sans-serif;color:#d6336c;min-height:6px}
.nav{position:absolute;top:42%;width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.85);color:#d6336c;font-size:22px;cursor:pointer;box-shadow:0 4px 12px var(--shadow)}.nav.l{left:0}.nav.r{right:0}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0 22px;flex-wrap:wrap}.dots i{width:8px;height:8px;border-radius:50%;background:rgba(214,51,108,.3);cursor:pointer}.dots i.on{background:#d6336c;transform:scale(1.3)}
details.lc{background:var(--card);border-left:3px solid var(--deep);border-radius:6px 14px 14px 14px;text-align:left;margin:14px 0;box-shadow:0 8px 22px var(--shadow);overflow:hidden}
details.lc summary{cursor:pointer;list-style:none;padding:12px 14px;font:italic 700 18px 'Cormorant Garamond','Hind Siliguri',serif;color:var(--deep);display:flex;justify-content:space-between;gap:8px}
details.lc summary::-webkit-details-marker{display:none}details.lc summary:after{content:"♥";font-size:14px}details.lc[open] summary:after{content:"♡"}
.lb{padding:0 14px 16px;white-space:pre-line;font-size:15px;line-height:1.9;animation:fd .6s ease}@keyframes fd{from{opacity:0;transform:translateY(8px)}}
.end{color:var(--deep);letter-spacing:6px;margin-top:26px}
.fl{position:fixed;pointer-events:none;z-index:5;animation:up 5s linear forwards;opacity:0;bottom:-20px}@keyframes up{10%{opacity:.8}to{transform:translateY(-105vh) rotate(40deg);opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← Back</a>
  <h1 id="lt">A Letter For You 💌</h1>
  <div class="car" id="car"><button class="nav l" id="pv" aria-label="Previous photo">‹</button><div class="polaroid" id="pol"><div class="pslot" id="slot"></div><div class="pcap" id="cap"></div></div><button class="nav r" id="nx" aria-label="Next photo">›</button></div>
  <div class="dots" id="dots"></div>
  <div id="lets"></div>
  <div class="end">♥♥♥</div>
</div>
<script>
const $=s=>document.querySelector(s),api=u=>fetch(u).then(r=>{if(!r.ok)throw 0;return r.json()});
let PH=[],i=-1,timer;
function show(n){i=(n+PH.length)%PH.length;const p=PH[i],f=$('#pol');f.classList.remove('flip');void f.offsetWidth;f.classList.toggle('alt',i%2===1);f.classList.add('flip');
 $('#slot').innerHTML='';if(p.src){const im=document.createElement('img');im.src=p.src;im.alt='Photo '+(i+1);$('#slot').appendChild(im)}else $('#slot').textContent='💌';
 $('#cap').textContent=p.caption||'';[...$('#dots').children].forEach((d,k)=>d.classList.toggle('on',k===i))}
function auto(){clearInterval(timer);if(PH.length>1)timer=setInterval(()=>show(i+1),4500)}
function go(n){show(n);auto()}
(async()=>{
 let C={};try{C=await api('/api/content')}catch{}
 if(C.letterTitle){$('#lt').textContent=C.letterTitle;document.title=C.letterTitle}
 try{PH=(await api('/api/photos')).photos}catch{}
 if(!PH.length)PH=[{}];
 PH.forEach((_,k)=>{const d=document.createElement('i');d.onclick=()=>go(k);$('#dots').appendChild(d)});
 if(PH.length<2){$('#pv').style.display=$('#nx').style.display='none';$('#dots').style.display='none'}
 show(0);auto();
 $('#pv').onclick=()=>go(i-1);$('#nx').onclick=()=>go(i+1);
 let x0=null;const car=$('#car');car.ontouchstart=e=>{x0=e.touches[0].clientX};car.ontouchend=e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)go(i+(dx<0?1:-1));x0=null};
 (C.letters||[]).forEach((l,k)=>{const d=document.createElement('details');d.className='lc';if(k===0)d.open=true;
  const s=document.createElement('summary');s.textContent=l.title||'Letter';const b=document.createElement('div');b.className='lb';b.textContent=l.body;d.append(s,b);$('#lets').appendChild(d)});
})();
setInterval(()=>{const e=document.createElement('span');e.className='fl';e.textContent=['✦','♥','♡'][Math.random()*3|0];e.style.left=Math.random()*100+'vw';e.style.fontSize=8+Math.random()*10+'px';e.style.color=['#ffb84d','#ff5d8f','#fff'][Math.random()*3|0];document.body.appendChild(e);setTimeout(()=>e.remove(),5000)},900);
</script>
</body>
</html>
